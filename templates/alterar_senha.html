<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - Massagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark {% if current_user.is_admin %}bg-dark{% else %}bg-primary{% endif %} mb-4">
        <div class="container">
            <span class="navbar-brand">🔑 Alterar Senha - {{ current_user.nome }}</span>
            <a href="{% if current_user.is_admin %}{{ url_for('admin_painel') }}{% else %}{{ url_for('usuario_painel') }}{% endif %}" class="btn btn-outline-light btn-sm">Voltar ao Painel</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 shadow-sm" style="max-width: 450px; width: 100%;">
            <h4 class="mb-3 text-center">Redefinir Minha Senha</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('alterar_senha') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Senha Atual</label>
                    <input type="password" name="senha_atual" class="form-control" placeholder="Digite sua senha atual" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nova Senha</label>
                    <input type="password" name="nova_senha" class="form-control" placeholder="Digite a nova senha" required minlength="4">
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirmar Nova Senha</label>
                    <input type="password" name="confirmacao_senha" class="form-control" placeholder="Repita a nova senha" required minlength="4">
                </div>

                <button type="submit" class="btn btn-success w-100 mb-2">Salvar Nova Senha</button>
                <a href="{% if current_user.is_admin %}{{ url_for('admin_painel') }}{% else %}{{ url_for('usuario_painel') }}{% endif %}" class="btn btn-outline-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
